# dodomogu.com 80 端口总配置
#
# 路由分工：
#   /            -> blog 静态站点
#   /hanabi/     -> hanabi 项目（dodomogu.d/hanabi.conf）
#   /mahjong/    -> mahjong 项目（dodomogu.d/mahjong.conf）
#
# 各二级项目的路由由项目自己维护，各自产出一个 location 片段放进
# /etc/nginx/conf.d/dodomogu.d/，由本文件统一 include。
# 片段文件只含 location，不能直接放进 conf.d/。
#
# 安装位置：/etc/nginx/conf.d/dodomogu.conf

server {
    listen 80;
    server_name dodomogu.com www.dodomogu.com;

    # blog：根目录静态站点
    location / {
        root /www/html/dodomogu-blog/dist;
        try_files $uri $uri/ /index.html;
    }

    # 二级项目路由（hanabi / mahjong）
    include /etc/nginx/conf.d/dodomogu.d/*.conf;
}
