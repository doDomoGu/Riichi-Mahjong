# mahjong 项目路由（/mahjong/ -> 统一网关）
#
# 网关（deploy/mahjong-gateway.service）按路径前缀再分发：
#   /mahjong/                -> home           3000  总导航页
#   /mahjong/wind/           -> wind           3001  风向盘
#   /mahjong/score-practice/ -> score-practice 3002  点数计算练习
#
# proxy_pass 结尾带 /，会剥掉 /mahjong 前缀，网关因此收到 /、/wind/、
# /score-practice/，与 server/index.js 里的路由一一对应。
#
# 网关实际监听 8081，不是 service 文件里配的 8080：服务器上有另一份
# nginx 配置（conf.d/mahjong-wind.conf，与本项目无关的旧文件）占用了
# 8080，网关的端口回退逻辑在启动时探测到占用后会自动漂移到 8081。
# 8080 那份是历史遗留，未清理前网关只能落在 8081，别再改回 8080。
#
# 安装位置：/etc/nginx/conf.d/dodomogu.d/mahjong.conf
# 由 dodomogu.conf 里的 include 引入，不要单独放进 conf.d/。

location = /mahjong {
    return 301 /mahjong/;
}

location ^~ /mahjong/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600;
}
